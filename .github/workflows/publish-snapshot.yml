name: Publish blocklist

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Staff entry operation
        type: choice
        options: [refresh, add, remove]
        default: refresh
      accountId:
        description: Numeric GitHub account ID
        type: string
      login:
        description: GitHub username
        type: string
      reason:
        description: Public reason
        type: string
      expiresAt:
        description: ISO-8601 UTC expiry
        type: string

permissions:
  contents: write

concurrency:
  group: blocklist-publisher
  queue: max

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update the published branch
        run: |
          if git ls-remote --exit-code origin refs/heads/published; then
            git fetch origin refs/heads/published
            git worktree add --detach "$RUNNER_TEMP/published" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/published" HEAD
          fi
          mkdir -p "$RUNNER_TEMP/published/staff-entries"
          node scripts/snapshot.mjs "$RUNNER_TEMP/published"
          git -C "$RUNNER_TEMP/published" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/published" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/published" add snapshot.json staff-entries
          git -C "$RUNNER_TEMP/published" commit -m "Publish blocklist ($GITHUB_RUN_ID)"
          git -C "$RUNNER_TEMP/published" push origin HEAD:refs/heads/published
