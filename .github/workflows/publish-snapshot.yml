name: Publish blocklist

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Snapshot to publish
        type: choice
        options: [production, staging]
        default: production
      operation:
        description: Staff entry operation
        type: choice
        options: [refresh, add, remove]
        default: refresh
      accountId:
        description: Numeric GitHub account ID
        type: string
      login:
        description: GitHub username
        type: string
      reason:
        description: Public reason
        type: string
      expiresAt:
        description: Optional UTC expiry (blank keeps the entry active until removed)
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.target == 'production' || inputs.target == 'staging')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["production","staging"]' || (inputs.target == 'staging' && '["staging"]' || '["production"]')) }}
    environment: ${{ matrix.target }}
    concurrency:
      group: blocklist-publisher-${{ matrix.target }}
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update the published branch
        env:
          SNAPSHOT_BRANCH: ${{ matrix.target == 'staging' && 'published-staging' || 'published' }}
        run: |
          if git ls-remote --exit-code origin "refs/heads/$SNAPSHOT_BRANCH"; then
            git fetch origin "refs/heads/$SNAPSHOT_BRANCH"
            git worktree add --detach "$RUNNER_TEMP/published" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/published" HEAD
          fi
          mkdir -p "$RUNNER_TEMP/published/staff-entries"
          node scripts/snapshot.mjs "$RUNNER_TEMP/published"
          git -C "$RUNNER_TEMP/published" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/published" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/published" add snapshot.json staff-entries
          git -C "$RUNNER_TEMP/published" commit -m "Publish blocklist ($GITHUB_RUN_ID)"
          git -C "$RUNNER_TEMP/published" push origin "HEAD:refs/heads/$SNAPSHOT_BRANCH"
